modLoader="javafml"
loaderVersion="${loader_version_range}"
license="MIT"
clientSideOnly=true

[[mods]]
modId="slumbersignal"
version="${version}"
displayName="SlumberSignal"
logoFile="assets/slumbersignal/icon.png"
authors="SlumberSignal"
displayTest="IGNORE_ALL_VERSION"

description='''Client-side only. Tells you the moment the Overworld night is dark enough to sleep,
with a heavily animated notification. Fires once per night, resets on dimension change or
disconnect, and never writes a config file.'''

[[dependencies.slumbersignal]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.slumbersignal]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
