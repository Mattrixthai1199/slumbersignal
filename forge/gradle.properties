# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false
org.gradle.caching=true

net.minecraftforge.gradle.merge-source-sets=true

# Forge — https://files.minecraftforge.net/
minecraft_version=26.1.2
minecraft_version_range=[26.1.2,26.2)
forge_version=64.1.0
forge_version_range=[64,)
loader_version_range=[64,)

# Mod
# MAJOR.MINOR.PATCH+mc<minecraft_version>  (single source of truth for the version)
mod_version=1.1.0+mc26.1.2
maven_group=com.slumbersignal
archives_base_name=slumbersignal
